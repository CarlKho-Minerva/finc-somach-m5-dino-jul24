[project]
name = "somach-dino"
version = "1.0.0"
description = "Local real-time sEMG to Chrome Dino controller"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.140.0",
  "numpy==1.26.4",
  "pyobjc-framework-Quartz==10.1; sys_platform == 'darwin'",
  "pyserial==3.5",
  "scipy==1.12.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.28.0",
  "websockets==12.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<0.28",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:The 'app' shortcut is now deprecated:DeprecationWarning:httpx\\._client",
]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
