[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
# CH340 adapters and loose demo cables are materially more reliable at 115200.
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<main.cpp>
    -<dual_drive.cpp>

# Two independent AD8232 channels for four-command data collection. This is a
# separate target so the proven single-channel image and its serial contract do
# not change. The NodeMCU-32S uses the same ESP32-WROOM-32 target family.
[env:dual_ad8232]
platform = espressif32@7.0.1
board = nodemcu-32s
framework = arduino
monitor_speed = 460800
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<dual_drive.cpp>
    -<main.cpp>
