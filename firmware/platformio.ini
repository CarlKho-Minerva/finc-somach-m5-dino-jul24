[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
# CH340 adapters and loose demo cables are materially more reliable at 115200.
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
